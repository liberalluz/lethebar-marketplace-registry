name: validate

on:
  pull_request:
    paths:
      - index.json
      - schema/**
      - tools/**
  push:
    branches: [main]
    paths:
      - index.json

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate.py --self-test
      - run: python tools/review.py --self-test
      - run: python tools/validate.py index.json
